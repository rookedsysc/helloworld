spring:
  application:
    name: kafka-az
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/kafka_az
    username: kafka_az
    password: kafka_az
  docker:
    compose:
      file: compose.yaml
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
