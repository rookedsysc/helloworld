services:
  postgres:
    image: postgres:17-alpine
    container_name: kafka-az-postgres
    environment:
      POSTGRES_DB: kafka_az
      POSTGRES_USER: kafka_az
      POSTGRES_PASSWORD: kafka_az
    ports:
      - "5432:5432"
    volumes:
      - kafka_az_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafka_az -d kafka_az"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    container_name: kafka-az-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - kafka_az_zookeeper_data:/var/lib/zookeeper/data
      - kafka_az_zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka-az-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_az_kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-az-kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-az-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
    container_name: kafka-az-frontend
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 4193
      BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8080/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4193:4193"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4193').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka_az_postgres_data:
  kafka_az_zookeeper_data:
  kafka_az_zookeeper_log:
  kafka_az_kafka_data:
